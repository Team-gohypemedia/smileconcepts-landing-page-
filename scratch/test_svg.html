<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #0A0B13; color: white; margin: 0; padding: 20px; font-family: sans-serif; }
    .box { border: 1px solid red; margin-bottom: 20px; width: 100%; max-width: 1200px; }
  </style>
</head>
<body>
  <h3>Option A: viewBox="0 0 800 120", font-size 54px</h3>
  <div class="box">
    <svg width="100%" height="200" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
      <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" stroke="#F47A4A" stroke-width="1.2" fill="none" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="4">
        SMILE CONCEPTS
      </text>
    </svg>
  </div>

  <h3>Option B: viewBox="0 0 950 130", font-size 60px</h3>

        SMILE CONCEPTS
      </text>
    </svg>
  </div>

  <h3>Option C: viewBox="0 0 1100 140", font-size 68px</h3>
  <div class="box">
    <svg width="100%" height="200" viewBox="0 0 1100 140" xmlns="http://www.w3.org/2000/svg">
      <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" stroke="#F47A4A" stroke-width="1.2" fill="none" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="68" letter-spacing="6">
        SMILE CONCEPTS
      </text>
    </svg>
  </div>
</body>
</html>
